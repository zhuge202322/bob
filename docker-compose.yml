services:
  hocore:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - hocore-data:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  hocore-data:
